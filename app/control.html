<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Worker</title>
<style>
:root{color-scheme:light dark;font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;padding:14px;background:transparent;color:CanvasText}.card{max-width:480px;margin:auto;border:1px solid color-mix(in srgb,CanvasText 16%,transparent);border-radius:14px;background:Canvas;padding:14px;box-shadow:0 8px 28px color-mix(in srgb,CanvasText 8%,transparent)}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}h1{font-size:17px;margin:0}.icon{border:0;background:transparent;color:inherit;font-size:18px;cursor:pointer;padding:5px 8px;border-radius:8px}.icon:hover{background:color-mix(in srgb,CanvasText 8%,transparent)}.status{font-size:12px;opacity:.68;margin-top:2px}.row{margin:11px 0}label{display:block;font-size:12px;font-weight:650;margin-bottom:5px}select,input{width:100%;border:1px solid color-mix(in srgb,CanvasText 18%,transparent);border-radius:9px;padding:9px 10px;background:Canvas;color:CanvasText;font:inherit}select:focus,input:focus{outline:2px solid Highlight;outline-offset:1px}.check{display:flex;gap:9px;align-items:center;font-size:13px;margin:10px 0}.check input{width:auto}.hint{font-size:11px;opacity:.62;margin-top:4px;line-height:1.45}.primary,.secondary{border:0;border-radius:9px;padding:9px 12px;font:inherit;font-weight:650;cursor:pointer}.primary{width:100%;background:Highlight;color:HighlightText;margin-top:8px}.secondary{background:color-mix(in srgb,CanvasText 9%,transparent);color:inherit}.primary:disabled,.secondary:disabled{opacity:.45;cursor:not-allowed}.notice{font-size:12px;padding:8px 9px;border-radius:8px;background:color-mix(in srgb,Highlight 9%,transparent);margin:8px 0}.error{background:color-mix(in srgb,#d22 12%,transparent)}.settings{display:none;border-top:1px solid color-mix(in srgb,CanvasText 12%,transparent);margin-top:12px;padding-top:12px}.settings.open{display:block}.settings h2{font-size:14px;margin:0 0 8px}.provider-list{margin-top:12px;display:grid;gap:7px}.provider-item{display:flex;align-items:center;justify-content:space-between;padding:8px;border-radius:9px;background:color-mix(in srgb,CanvasText 5%,transparent);font-size:12px}.provider-copy{min-width:0}.provider-copy strong,.provider-copy small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.provider-copy small{opacity:.6;margin-top:2px}.actions{display:flex;gap:6px;margin-top:9px}.actions>*{flex:1}.worker-fields.hidden,.hidden{display:none!important}.mode-note{padding:9px;border-radius:9px;background:color-mix(in srgb,CanvasText 5%,transparent);font-size:12px;line-height:1.5;margin:8px 0}
</style>
</head>
<body>
<section class="card">
<header><div><h1>Worker</h1><div id="codexLine" class="status">正在连接…</div></div><button id="settingsButton" class="icon" type="button" title="模型源设置">⚙</button></header>
<div id="message" class="notice hidden"></div>

<div class="row"><label for="mode">模式</label><select id="mode"><option value="NATIVE">原生</option><option value="WORKER">Worker</option></select></div>
<div id="nativeNote" class="mode-note">原生模式不接管当前会话。Codex 按官方默认行为工作。</div>

<div id="workerFields" class="worker-fields hidden">
<div class="row"><label for="provider">模型源</label><select id="provider"></select></div>
<div class="row"><label for="model">Worker 模型</label><select id="model"></select></div>
<div class="row"><label for="reasoning">思考</label><select id="reasoning"></select><div id="reasoningHint" class="hint"></div></div>
<label class="check"><input id="fullAccess" type="checkbox" checked> Worker 完全访问</label>
<label class="check"><input id="autoVerify" type="checkbox" checked> 完成后自动检查</label>
<div id="supervisionHint" class="hint">主控只读监督 · 自动有界续期</div>
</div>
<button id="saveProfile" class="primary" type="button">使用原生模式</button>

<div id="settings" class="settings">
<h2>模型源</h2>
<div class="row"><label for="providerName">名称</label><input id="providerName" autocomplete="off" placeholder="My Provider"></div>
<div class="row"><label for="providerUrl">API 地址</label><input id="providerUrl" autocomplete="off" placeholder="https://api.example.com/v1"></div>
<div class="row"><label for="providerKey">API Key</label><input id="providerKey" type="password" autocomplete="new-password" placeholder="留空则保留已保存密钥"></div>
<div class="actions"><button id="saveProvider" class="secondary" type="button">测试并保存</button><button id="connectCodex" class="secondary" type="button">连接 Codex</button></div>
<div id="providerList" class="provider-list"></div>
</div>
</section>
<script>
'use strict';
const PROTOCOL='2026-01-26';let seq=1;const pending=new Map();let state={catalog:{providers:[],profile:{},mode:'NATIVE'},codex:{installed:false}};
function rpc(method,params={}){const id=seq++;parent.postMessage({jsonrpc:'2.0',id,method,params},'*');return new Promise((resolve,reject)=>{const timer=setTimeout(()=>{pending.delete(id);reject(new Error(method+' timed out'))},20000);pending.set(id,{resolve,reject,timer})})}
function notify(method,params={}){parent.postMessage({jsonrpc:'2.0',method,params},'*')}
addEventListener('message',event=>{const m=event.data;if(!m||m.jsonrpc!=='2.0'||m.id===undefined)return;const p=pending.get(m.id);if(!p)return;pending.delete(m.id);clearTimeout(p.timer);if(m.error)p.reject(new Error(m.error.message||'MCP App error'));else p.resolve(m.result)});
function value(result){if(result?.isError){let msg='操作失败';try{msg=JSON.parse(result.content?.[0]?.text||'{}').error||msg}catch{}throw new Error(msg)}if(result?.structuredContent!==undefined)return result.structuredContent;const text=result?.content?.find?.(x=>x.type==='text')?.text;if(!text)return{};try{return JSON.parse(text)}catch{return{text}}}
async function tool(name,args={}){return value(await rpc('tools/call',{name,arguments:args}))}
const $=id=>document.getElementById(id);function show(text,error=false){const n=$('message');if(!text){n.classList.add('hidden');return}n.textContent=text;n.className='notice'+(error?' error':'')}
function option(select,v,label){const o=document.createElement('option');o.value=v;o.textContent=label;select.append(o)}
function currentProvider(){return state.catalog.providers.find(p=>p.id===$('provider').value)||null}function currentModel(){return currentProvider()?.models?.find(m=>m.id===$('model').value)||null}
function duration(ms){const minutes=Math.max(1,Math.round(Number(ms||0)/60000));return minutes>=60?Math.round(minutes/60)+' 小时':minutes+' 分钟'}
function renderReasoning(preferred){const select=$('reasoning');select.replaceChildren();const capability=currentModel()?.reasoning;const values=capability?.options?.length?capability.options:[{value:'auto',label:'Auto'}];for(const item of values)option(select,item.value,item.label||item.value);if(values.some(x=>x.value===preferred))select.value=preferred;else select.value='auto';$('reasoningHint').textContent=capability?.advertised?`上游明确能力 · ${capability.kind}`:'上游未暴露思考控制，将使用模型默认（Auto）'}
function renderModels(preferredModel,preferredReasoning){const select=$('model');select.replaceChildren();const provider=currentProvider();for(const model of provider?.models||[])option(select,model.id,model.name||model.id);if([...select.options].some(o=>o.value===preferredModel))select.value=preferredModel;renderReasoning(preferredReasoning)}
function renderMode(){const mode=$('mode').value,worker=mode==='WORKER';$('workerFields').classList.toggle('hidden',!worker);$('nativeNote').classList.toggle('hidden',worker);$('saveProfile').textContent=worker?'开启 Worker 模式':'使用原生模式';resize()}
function renderProviders(){const profile=state.catalog.profile||{},select=$('provider');select.replaceChildren();for(const provider of state.catalog.providers)option(select,provider.id,provider.name);if([...select.options].some(o=>o.value===profile.providerId))select.value=profile.providerId;renderModels(profile.modelId,profile.reasoning);$('fullAccess').checked=(profile.access||'danger-full-access')==='danger-full-access';$('autoVerify').checked=profile.autoVerify!==false;$('mode').value=state.catalog.mode||state.catalog.session?.mode||'NATIVE';$('supervisionHint').textContent=`主控只读监督 · 自动有界续期 · ${duration(profile.leaseMs||900000)} 观察点 · 最长 ${duration(profile.maxTotalMs||3600000)}`;$('codexLine').textContent=state.codex.installed?'Codex 已连接':'Codex 尚未连接';$('connectCodex').textContent=state.codex.installed?'Codex 已连接':'连接 Codex';$('connectCodex').disabled=state.codex.installed;renderProviderList();renderMode();if(!state.catalog.providers.length&&$('mode').value==='WORKER'){$('settings').classList.add('open');show('先添加一个模型源。')}}
function renderProviderList(){const root=$('providerList');root.replaceChildren();for(const p of state.catalog.providers){const row=document.createElement('div');row.className='provider-item';const copy=document.createElement('div');copy.className='provider-copy';const strong=document.createElement('strong');strong.textContent=p.name;const small=document.createElement('small');small.textContent=`${p.models?.length||0} 个模型 · ${p.apiKeyConfigured?'密钥已保存':'无密钥'}`;copy.append(strong,small);const buttons=document.createElement('div');const refresh=document.createElement('button');refresh.className='icon';refresh.textContent='↻';refresh.title='刷新模型';refresh.onclick=async()=>{try{show('正在刷新模型…');await tool('provider_refresh',{id:p.id});await reload();show('模型已刷新')}catch(e){show(e.message,true)}};const del=document.createElement('button');del.className='icon';del.textContent='×';del.title='删除';del.onclick=async()=>{if(!confirm(`删除 ${p.name}？`))return;try{await tool('provider_delete',{id:p.id});await reload();show('已删除')}catch(e){show(e.message,true)}};buttons.append(refresh,del);row.append(copy,buttons);root.append(row)}}
async function reload(){const [catalog,codex]=await Promise.all([tool('worker_catalog',{}),tool('codex_status',{})]);state={catalog,codex};renderProviders();resize()}
async function saveProfile(){const desired=$('mode').value;try{if(desired==='NATIVE'){await tool('session_mode_set',{mode:'NATIVE'});await reload();show('当前会话已恢复原生模式。');return}const provider=currentProvider(),model=currentModel();if(!provider||!model){show('请选择模型源和模型。',true);return}await tool('worker_profile_set',{providerId:provider.id,modelId:model.id,reasoning:$('reasoning').value,access:$('fullAccess').checked?'danger-full-access':'workspace-write',autoVerify:$('autoVerify').checked,autoExtend:true,leaseMs:900000,maxTotalMs:3600000});await tool('session_mode_set',{mode:'WORKER'});await reload();show('Worker 模式已启用。主控保持只读监督，Worker 负责执行。')}catch(e){show(e.message,true)}}
async function saveProvider(){const name=$('providerName').value.trim(),baseUrl=$('providerUrl').value.trim(),apiKey=$('providerKey').value;if(!name||!baseUrl){show('请填写名称和 API 地址。',true);return}try{show('正在连接并读取模型…');const result=await tool('provider_save',{name,baseUrl,apiKey,adapter:'openai-compatible'});$('providerKey').value='';await reload();if(result.provider?.id)$('provider').value=result.provider.id;renderModels('', 'auto');show(result.tested?'模型源已保存。':`已保存，但测试失败：${result.error||'未知错误'}`,!result.tested)}catch(e){show(e.message,true)}}
async function connectCodex(){try{show('正在连接 Codex…');state.codex=await tool('codex_install',{});renderProviders();show('Codex 已连接。')}catch(e){show(e.message,true)}}
function resize(){notify('ui/notifications/size-changed',{height:Math.ceil(document.documentElement.scrollHeight+4)})}
$('settingsButton').onclick=()=>{$('settings').classList.toggle('open');resize()};$('mode').onchange=renderMode;$('provider').onchange=()=>renderModels('', 'auto');$('model').onchange=()=>renderReasoning('auto');$('saveProfile').onclick=saveProfile;$('saveProvider').onclick=saveProvider;$('connectCodex').onclick=connectCodex;
new ResizeObserver(resize).observe(document.body);
(async()=>{try{await rpc('ui/initialize',{protocolVersion:PROTOCOL,appInfo:{name:'delegation-worker-control',version:'0.2.0'},appCapabilities:{}});notify('ui/notifications/initialized',{});await reload()}catch(e){show(e.message,true);resize()}})();
</script>
</body>
</html>
